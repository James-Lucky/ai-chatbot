<?xml version="1.0" encoding="utf-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="48"
  height="48"
  viewBox="0 0 48 48"
  fill="none"
>
  <defs>
    <!-- Main Purple Gradient -->
    <linearGradient
      id="purpleGradient"
      x1="6"
      y1="4"
      x2="42"
      y2="44"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Subtle Highlight -->
    <linearGradient
      id="highlight"
      x1="15"
      y1="11"
      x2="32"
      y2="34"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>

    <!-- Soft Shadow -->
    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="150%"
    >
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-opacity="0.2"
      />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect
    x="4"
    y="4"
    width="40"
    height="40"
    rx="13"
    fill="url(#purpleGradient)"
    filter="url(#shadow)"
  />

  <!-- Top subtle highlight -->
  <path
    d="M15 7H33C37.4 7 41 10.6 41 15"
    stroke="#E9D5FF"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Inner Chat Bubble -->
  <path
    d="
      M12 16
      C12 12.7 14.7 10 18 10
      H30
      C33.3 10 36 12.7 36 16
      V26
      C36 29.3 33.3 32 30 32
      H23
      L18 36
      V32
      H18
      C14.7 32 12 29.3 12 26
      Z
    "
    fill="url(#highlight)"
  />

  <!-- AI Eyes -->
  <rect
    x="18"
    y="18"
    width="3"
    height="6"
    rx="1.5"
    fill="#5B21B6"
  />

  <rect
    x="27"
    y="18"
    width="3"
    height="6"
    rx="1.5"
    fill="#5B21B6"
  />

  <!-- Friendly Smile -->
  <path
    d="M20.5 26C22.2 27.7 25.8 27.7 27.5 26"
    stroke="#7C3AED"
    stroke-width="1.7"
    stroke-linecap="round"
  />

  <!-- Three AI Dots -->
  <circle
    cx="19"
    cy="14.5"
    r="1"
    fill="#C4B5FD"
  />

  <circle
    cx="24"
    cy="14.5"
    r="1"
    fill="#C4B5FD"
  />

  <circle
    cx="29"
    cy="14.5"
    r="1"
    fill="#C4B5FD"
  />
</svg>